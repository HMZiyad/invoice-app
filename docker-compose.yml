version: '3.9'

services:
  # ──────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: luminous_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: luminous_extraction
      POSTGRES_USER: luminous
      POSTGRES_PASSWORD: luminous_secret
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/src/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luminous -d luminous_extraction"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # Express Backend
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luminous_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://luminous:luminous_secret@db:5432/luminous_extraction
      PORT: 4000
      N8N_WEBHOOK_URL: https://aiteamsta.app.n8n.cloud/webhook/rentmas-quotation
      CORS_ORIGIN: http://localhost:80
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "4000:4000"

  # ──────────────────────────────────────────────
  # React Frontend (nginx)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luminous_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
